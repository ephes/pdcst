name: Python checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    env:
      PDCST_TEST_WHEEL: "1"
      PDCST_HOME: ${{ runner.temp }}/pdcst-home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install wheel with test extra
        run: |
          mkdir -p "$PDCST_HOME"
          python -m pip install build
          python -m build --wheel
          python -m pip install "$(echo dist/*.whl)[test]"
      - name: Run synthetic tests and installed-package smoke check
        run: python -m pytest
